[pytest]
testpaths = tests
python_files = *_test.py test_*.py
; `--cov` здесь, а не в CI: число, которое видно только в зелёной задаче,
; никого ни к чему не обязывает. Порог — в .coveragerc.
addopts = --tb=short --strict-markers --cov --cov-report=term-missing:skip-covered
; Зависший тест иначе держит задачу до предела самого CI и не говорит, какой
; именно тест это был.
timeout = 60
markers =
    integration: ходит в базу или зовёт чужую команду
