name: release

# Версию поднимает `cz bump --no-tag` на машине автора: он правит манифест и
# дописывает CHANGELOG. Тег ставит отсюда первая задача — на тот коммит `main`,
# который и вышел: слияние переписывает SHA, и тег, поставленный на ветке,
# указывал бы на коммит, которого в `main` нет.
#
# Поэтому и триггер — ветка, а не тег: тег, созданный токеном задачи, чужих
# процессов не запускает, так что «поставить тег» и «выпустить» обязаны жить в
# одном файле.
on:
  push:
    branches: [main]

# Права выдаются по задаче, а не всему файлу: собирает код одна, а подписывать
# и публиковать умеют другие, и кода они уже не видят.
permissions: {}

jobs:
  tag:
    name: tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.named.outputs.version }}
      fresh: ${{ steps.named.outputs.fresh }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          python-version: "3.14"
      # Версия в манифесте — единственный признак релиза: в `main` приезжает и
      # то, что версии не меняет, и такое слияние ничего не выпускает.
      - name: Версия и была ли она уже выпущена
        id: named
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(uv version --short)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "v$version уже выпущена — выпускать нечего"
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi
      # Объект с автором, датой и сообщением, а не голый указатель: `git
      # describe` и хостинг читают аннотированный тег как релиз. Через API, а не
      # `git push`: пушить нечего, а токен тогда не оседает в `.git/config`.
      - name: Тег на этот коммит
        if: steps.named.outputs.fresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.named.outputs.version }}
        run: |
          set -euo pipefail
          object="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="v$VERSION" \
            -f message="v$VERSION" \
            -f object="$GITHUB_SHA" \
            -f type=commit \
            --jq .sha)"
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v$VERSION" \
            -f sha="$object"

  build:
    name: build
    needs: [tag]
    if: needs.tag.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Без кэша: отравленная запись в нём уехала бы в колесо, которое
          # отсюда уходит людям. Экономить секунды на релизе незачем.
          enable-cache: false
          python-version: "3.14"
      # Дерево то же, что прошло ci, но сборка обязана получиться и здесь:
      # колесо собирают из репозитория, а не из машины.
      - run: uv build --out-dir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 1

  publish:
    name: publish
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Окружение с ограничением по ветке и тегу: без него короткоживущий токен
    # PyPI мог бы попросить любой прогон этого репозитория.
    environment: release
    permissions:
      # Доверенная публикация: PyPI выдаёт одноразовый токен под этот прогон, и
      # долгоживущего пароля в секретах не заводится вовсе.
      id-token: write
    steps:
      # Исходников тут нет намеренно: задача, которой доверен токен, ничего из
      # репозитория не выполняет.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  announce:
    name: announce
    needs: [tag, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Релиз на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          # Раздел этой версии из CHANGELOG, который уже написал `cz bump`.
          awk -v tag="$TAG" '
            $0 ~ "^## " tag "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ -s notes.md ]]; then
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
