name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

# Пуш поверх пуша отменяет предыдущий прогон той же ветки: проверять
# промежуточное состояние незачем, а очередь оно занимает.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: gate
    # Запрос, головой которого стоит долгоживущая ветка, — это релиз или
    # возврат из `main`: тот же коммит уже проверен пушем в неё, и второй
    # прогон только дублирует работу. Открывает такие запросы бот, а прогон,
    # заведённый не человеком, GitHub держит до подтверждения — жёлтая плашка
    # на каждом релизе ровно об этом.
    #
    # Проверка на «этот же репозиторий» обязательна: имя ветки выбирает тот,
    # кто её создал, и в форке она может называться `main`. Без неё запрос из
    # форка снимал бы с себя обязательные проверки, называясь их именем, —
    # пропущенная задача засчитывается как успешная.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
      || !contains(fromJSON('["develop", "main"]'), github.head_ref)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Иначе токен задачи остаётся в `.git/config`, и всё, что заархивирует
          # рабочую директорию, унесёт его с собой. Здесь никто не пушит.
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked --all-groups

      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Tests
        run: uv run pytest -q

      # Библиотека проверяет сама себя. `--all` добавляет правила, которым нужна
      # живая среда: в хуке на коммит им не место, а здесь им самое место.
      - name: Проверки соглашений
        run: uv run py-checks run --all
      - name: Контракты собраны заново
        run: uv run py-checks sync --check
      # И сами настройки: правило без таблицы молчит, а молчание выглядит как
      # соблюдённое соглашение. В хук это не ставится — здесь читается дерево.
      - name: Настройки сходятся
        run: uv run py-checks doctor
      - name: Импорты не пересекают границы
        run: uv run lint-imports --no-logo

      # Хуки ещё раз, по всем файлам. Хук работает только на машине, которая
      # его поставила, и только пока никто не написал --no-verify; здесь он
      # перестаёт быть добровольным.
      - name: Хуки
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # Замок — это и есть сборка: манифест, поправленный без пересборки замка,
      # ставит зависимости, которых никто не выбирал.
      - name: Замок согласован с манифестом
        run: uv lock --check

  commits:
    name: commits
    # Запрос, головой которого стоит долгоживущая ветка, — это релиз или
    # возврат из `main`: тот же коммит уже проверен пушем в неё, и второй
    # прогон только дублирует работу. Открывает такие запросы бот, а прогон,
    # заведённый не человеком, GitHub держит до подтверждения — жёлтая плашка
    # на каждом релизе ровно об этом.
    #
    # Проверка на «этот же репозиторий» обязательна: имя ветки выбирает тот,
    # кто её создал, и в форке она может называться `main`. Без неё запрос из
    # форка снимал бы с себя обязательные проверки, называясь их именем, —
    # пропущенная задача засчитывается как успешная.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
      || !contains(fromJSON('["develop", "main"]'), github.head_ref)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Вся история: диапазон ниже достаёт коммиты, которых у мелкого клона нет.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked --all-groups
      # Хук commit-msg локальный: на машине, которая его не ставила, его нет, а
      # на той, что ставила, его снимает --no-verify. Сюда сообщения приезжают
      # уже написанными, и обойти проверку нечем.
      - name: Сообщения коммитов по соглашению
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Первый пуш ветки сообщает базу из одних нулей: тогда ею становится
          # точка расхождения с `develop` — не вся история от начала времён.
          base="$BASE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git merge-base origin/develop "$HEAD" 2>/dev/null || true)"
          fi
          range="$HEAD"
          if [[ -n "$base" ]]; then
            range="$base..$HEAD"
          fi
          # По первому родителю и без слияний: ветка отвечает за то, что
          # написала сама, а не за историю, которую влила — чужие сообщения
          # судил тот запрос, которым они приехали. Сообщение самого слияния
          # пишет GitHub, и соглашению оно не подчиняется.
          for sha in $(git rev-list --first-parent --no-merges "$range"); do
            git log -1 --pretty=%B "$sha" | uv run cz check --commit-msg-file /dev/stdin
          done
