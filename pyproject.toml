[project]
name = "python-checks"
version = "0.1.0"
description = "Проверки архитектурных соглашений проекта"
readme = "README.md"
authors = [{ name = "Armontex", email = "windle1337@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "import-linter>=2.15,<3",
    "libcst>=1.9,<2",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "rich>=15.0.0,<16.0.0",
    "typer>=0.27.2,<0.28",
]

[project.scripts]
python-checks = "python_checks.cli:main"

[project.entry-points."python_checks.checks"]
annotation-shapes = "python_checks.checks.types:AnnotationShapes"
bound-checks = "python_checks.checks.database:BoundChecks"
class-modules = "python_checks.checks.placement:ClassModules"
class-placement = "python_checks.checks.placement:ClassPlacement"
config-fields = "python_checks.checks.types:ConfigFields"
confined-calls = "python_checks.checks.database:ConfinedCalls"
confined-functions = "python_checks.checks.calls:ConfinedFunctions"
confined-imports = "python_checks.checks.imports:ConfinedImports"
confined-types = "python_checks.checks.types:ConfinedTypes"
constant-annotations = "python_checks.checks.types:ConstantAnnotations"
dependency-bounds = "python_checks.checks.hygiene:DependencyBounds"
determinism = "python_checks.checks.effects:Determinism"
endpoint-declarations = "python_checks.checks.api:EndpointDeclarations"
frozen-dataclasses = "python_checks.checks.types:FrozenDataclasses"
keyword-only-arguments = "python_checks.checks.signatures:KeywordOnlyArguments"
log-events = "python_checks.checks.effects:LogEvents"
model-boundary = "python_checks.checks.database:ModelBoundary"
model-columns = "python_checks.checks.database:ModelColumns"
module-length = "python_checks.checks.signatures:ModuleLength"
nesting = "python_checks.checks.signatures:Nesting"
operation-shape = "python_checks.checks.placement:OperationShape"
raw-sql = "python_checks.checks.database:RawSql"
required-class = "python_checks.checks.placement:RequiredClass"
schema-drift = "python_checks.checks.database:SchemaDrift"
sealed-imports = "python_checks.checks.imports:SealedImports"
signature-layout = "python_checks.checks.signatures:SignatureLayout"
statement-keys = "python_checks.checks.database:StatementKeys"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4,<2",
    "commitizen>=4.10,<5",
    "pre-commit>=4.6.2,<5",
    "pyright>=1.1.414,<2",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-mock>=3.15.1,<4",
    "pytest-randomly>=5.0.0,<6",
    "pytest-timeout>=2.4.0,<3",
    "ruff>=0.16.7,<0.17",
    "syrupy>=6.1.1,<7",
]
