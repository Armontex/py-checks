# Библиотека проверяет сама себя: правило, которое не выдерживает свой же
# репозиторий, до чужого доезжать не должно.

# Таблицы настроек библиотеки — это `dict[str, ...]`, у которых ключ приходит
# из TOML проекта: путь, имя пакета, код проверки. Ключи здесь и есть данные,
# то есть ровно тот случай, ради которого у правила существует пометка, — а
# ставить её тридцать три раза значит написать «это не поля» в каждом файле.
ignore = ["annotation-shapes"]
# примеры для проверок нарушают правила намеренно
extend-exclude = ["tests/checks/*"]

# Библиотека — не сервис: точек входа у неё нет, командная строка и есть край.
[confined-imports]
typer = ["cli"]

# Слои этой библиотеки: `config` не знает никого, `core` стоит на нём, правила
# и контракты стоят на ядре, а `cli` собирает всё вместе и потому видит всех.
[contracts.layers]
config = ["config"]
core = ["core", "config"]
checks = ["checks", "core", "config"]
contracts = ["contracts", "config"]
environment = ["environment", "config"]
sync = ["sync", "contracts", "environment", "config"]
# Гейт зовёт mutmut и git и ничего не печатает: что сказать и с каким кодом
# выйти, решает `cli`.
mutation = ["mutation", "config"]
cli = ["cli", "sync", "contracts", "environment", "mutation", "core", "config"]
