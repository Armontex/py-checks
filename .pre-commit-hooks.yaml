# The hooks the library publishes. Everything else — ruff, pyright,
# import-linter, commitizen — the project declares itself: each has its own
# hook, written by its own authors, and they know more about themselves than
# we would.

- id: py-checks
  name: project conventions hold
  description: the code follows the conventions written in the project's settings
  # One hook, not a hook per rule: what is on is the project config's call,
  # and the hook list does not have to repeat it in a second voice. To repair
  # what repairs itself — `args: [--fix]`; to run a set of rules — `args:
  # [--select, "<code>,<code>"]`. ruff works the same way.
  entry: py-checks run
  language: python
  types: [python]

- id: py-checks-sync
  name: built files match the code
  description: the import contracts or `.env.example` fell behind what they are built from
  # The contracts are built from the layer table and from what is on disk,
  # `.env.example` from the fields of the settings classes: both can fall
  # behind without the file itself being edited, hence `always_run`.
  entry: py-checks sync --check
  language: python
  always_run: true
  pass_filenames: false
