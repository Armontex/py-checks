# Хуки, которые публикует библиотека. Всё остальное — ruff, pyright,
# import-linter, commitizen — проект объявляет сам: у каждого есть свой хук,
# написанный его же авторами, и о себе они знают больше, чем знали бы мы.

- id: py-checks
  name: проверки соглашений проекта
  description: код следует соглашениям, записанным в настройках проекта
  # Один хук, а не хук на правило: что включено, решает конфиг проекта, и
  # список хуков не обязан повторять его вторым голосом. Починить то, что
  # чинится само, — `args: [--fix]`; позвать набор правил — `args: [--select,
  # "<код>,<код>"]`. Так же это устроено у ruff.
  entry: py-checks run
  language: python
  types: [python]

- id: py-checks-sync
  name: контракты импортов собраны заново
  description: файл контрактов отстаёт от объявленных слоёв или от того, что лежит на диске
  # Собирается из таблицы слоёв и из того, что лежит на диске, поэтому отстать
  # может и без правки самого файла — отсюда `always_run`.
  entry: py-checks sync --check
  language: python
  always_run: true
  pass_filenames: false
