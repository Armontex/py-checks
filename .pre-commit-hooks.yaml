- id: python-checks
  name: проверки соглашений проекта
  description: все проверки, включённые в [tool.python-checks]
  entry: python-checks run
  language: python
  types: [python]

- id: module-length
  name: модуль не длиннее лимита
  description: длинный модуль — это обычно несколько модулей, которые не разъехались вовремя
  entry: python-checks run --select module-length
  language: python
  types: [python]

- id: keyword-only-arguments
  name: сигнатура записана полностью
  description: аргумент, переданный по позиции, читается только вместе с сигнатурой
  entry: python-checks run --select keyword-only-arguments --fix
  language: python
  types: [python]

- id: python-checks-sync
  name: контракты импортов собраны заново
  description: файл контрактов отстаёт от объявленных слоёв или от того, что лежит на диске
  entry: python-checks sync --check
  language: python
  always_run: true
  pass_filenames: false
