minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, pre-push, commit-msg]

exclude: |
  (?x)^(
      .venv/|
      venv/|
      build/|
      dist/|
      migrations/versions/|
      alembic/versions/|
      node_modules/|
      __pycache__/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: commitizen
        name: commitizen (commit message)
        entry: env -u VIRTUAL_ENV uv run cz check --commit-msg-file
        language: system
        stages: [commit-msg]

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pytest-unit
        name: pytest (non-integration)
        entry: uv run pytest -q -m "not integration"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: bandit
        name: bandit
        entry: uv run bandit -r src -ll -ii
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: uv-lock
        name: uv lock check
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: uv-build
        name: uv build
        entry: uv build --out-dir dist
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
