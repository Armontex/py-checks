[tool.py-checks]
src = "."

# Дом объявляется адресом: вид, у которого дом назван, живёт только там.
# Поэтому домам положено быть перечисленными всем — доменный value object
# тоже dataclass, и его дом здесь назван наравне с `application/dto`.
[tool.py-checks.layout.errors]
home = ["error"]

[tool.py-checks.layout.exceptions]
home = ["error"]

[tool.py-checks.layout."application/ports"]
home = ["port"]

[tool.py-checks.layout."application/dto"]
home = ["dataclass"]

[tool.py-checks.layout.domain]
home = ["dataclass"]

[tool.py-checks.layout."infra/database/repositories"]
suffix = "Repository"

[tool.py-checks.layout."application/use_cases"]
suffix = "UseCase"

[tool.py-checks.layout."application/services"]
suffix = "Service"
