[tool.py-checks]
src = "."

[tool.py-checks.layout.use_cases]
suffix = "UseCase"
required = true

[tool.py-checks.layout.repositories]
suffix = "Repository"
required = true

[tool.py-checks.layout.config]
suffix = "Settings"
required = true

# Классов одного вида в модуле сколько угодно, но каждый носит суффикс.
[tool.py-checks.layout."domain/value_objects"]
only = ["dataclass"]
suffix = "Value"
named = true
