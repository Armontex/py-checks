[tool.py-checks]
src = "."

[tool.py-checks.layout.use_cases]
suffix = "UseCase"
operation = { method = "execute", max-arguments = 3, forbids = ["UnitOfWork"] }

# У сервиса дверей столько, сколько переходов у его сущности: одна на переход,
# потому что вызывающий, которому пришлось бы сделать три вызова, сделает два.
[tool.py-checks.layout."application/services"]
suffix = "Service"
operation = { forbids = ["UnitOfWork"] }

# Команды и запросы разнесены по директориям, и каждая сторона берёт свой вход.
[tool.py-checks.layout."use_cases/queries"]
suffix = "UseCase"
operation = { method = "execute", takes = "Query" }

[tool.py-checks.layout."use_cases/commands"]
suffix = "UseCase"
operation = { method = "execute", takes = "Command" }
