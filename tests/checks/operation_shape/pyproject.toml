[tool.python-checks]
src = "."

[[tool.python-checks.operation-shape.operations]]
inside = "use_cases"
suffix = "UseCase"
method = "execute"
forbids = ["UnitOfWork"]

# У сервиса дверей столько, сколько переходов у его сущности: одна на переход,
# потому что вызывающий, которому пришлось бы сделать три вызова, сделает два.
[[tool.python-checks.operation-shape.operations]]
inside = "application/services"
suffix = "Service"
forbids = ["UnitOfWork"]
