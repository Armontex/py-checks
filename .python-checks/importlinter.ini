# Контракты импортов. Файл собирает `python-checks sync` из таблицы слоёв
# библиотеки и секции [tool.python-checks.layers] проекта — править его нечего,
# следующий sync перезапишет.

[importlinter]
root_packages =
    python_checks

[importlinter:contract:layer-checks]
name = checks не импортирует чужое
type = forbidden
allow_indirect_imports = True
source_modules =
    python_checks.checks
forbidden_modules =
    python_checks.cli
    python_checks.contracts
    python_checks.sync

[importlinter:contract:layer-cli]
name = cli не импортирует чужое
type = forbidden
allow_indirect_imports = True
source_modules =
    python_checks.cli
forbidden_modules =
    python_checks.checks

[importlinter:contract:layer-config]
name = config не импортирует чужое
type = forbidden
allow_indirect_imports = True
source_modules =
    python_checks.config
forbidden_modules =
    python_checks.checks
    python_checks.cli
    python_checks.contracts
    python_checks.core
    python_checks.sync

[importlinter:contract:layer-contracts]
name = contracts не импортирует чужое
type = forbidden
allow_indirect_imports = True
source_modules =
    python_checks.contracts
forbidden_modules =
    python_checks.checks
    python_checks.cli
    python_checks.core
    python_checks.sync

[importlinter:contract:layer-core]
name = core не импортирует чужое
type = forbidden
allow_indirect_imports = True
source_modules =
    python_checks.core
forbidden_modules =
    python_checks.checks
    python_checks.cli
    python_checks.contracts
    python_checks.sync

[importlinter:contract:layer-sync]
name = sync не импортирует чужое
type = forbidden
allow_indirect_imports = True
source_modules =
    python_checks.sync
forbidden_modules =
    python_checks.checks
    python_checks.cli
    python_checks.core
